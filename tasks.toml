[[task]]
  id = "gen"
  type = "short"
  dependencies = ["gen-models", "gen-server", "gen-client"]

[[task]]
  id = "gen-models"
  type = "short"
  cmd = "oapi-codegen --config=configs/models.cfg.yml openapi-spec.yml"

[[task]]
  id = "gen-server"
  type = "short"
  cmd = "oapi-codegen --config=configs/server.cfg.yml openapi-spec.yml"

[[task]]
  id = "gen-client"
  type = "short"
  cmd = "oapi-codegen --config=configs/client.cfg.yml openapi-spec.yml"
