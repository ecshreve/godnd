version: "3.8"

services:
  db:
    image: ecshreve/5e-database:local
    ports:
      - 27017:27017

  cache:
    image: redis:6.2.5
    ports:
      - 6379:6379

  api:
    image: ecshreve/5e-srd-api:local
    environment:
      MONGODB_URI: mongodb://db/5e-database
      REDIS_URL: redis://cache:6379
    ports:
      - 3003:3000
    depends_on:
      - db
      - cache
